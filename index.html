<!-- 1. 読み込み回数をカウントしてリダイレクトするJavaScript -->
<script>
  let loadCount = 0;
  function checkSubmit() {
    loadCount++;
    // 2回目の読み込み（送信完了画面の表示）を検知したら遷移する
    if (loadCount === 2) {
      // ★↓ ここに回答後に飛ばしたいURLを入力してください ↓★
      window.location.href = "https://sites.google.com/view/toge-gacha/%E3%83%9B%E3%83%BC%E3%83%A0"; 
    }
  }
</script>
